title: noSugarK
description: noSugarK 的个人主页与博客
url: https://nosugark.cc.cd
timezone: Asia/Shanghai

# 文章链接形如 /blog/2026/09/18/hello-world/
permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-feed

# 简历内容已并入首页，这两个文件留在仓库里但不再单独出页面，避免重复内容
exclude:
  - README_en.md
  - Gemfile
  - Gemfile.lock
  - vendor
  # 本地小工具，不是站点内容；不排除的话会原样发布成 /tools/img2webp.py
  - tools
